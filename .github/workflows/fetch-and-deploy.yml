name: Fetch News & Deploy

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest news
        run: npm run fetch

      - name: Build static site
        run: npm run build

      - name: Copy to docs folder
        run: |
          mkdir -p docs
          cp -r public/* docs/

      - name: Commit and push docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto-update news feed - $(date +'%Y-%m-%d %H:%M')"
          git push
